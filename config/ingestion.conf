[env]
environment = dev

[paths]
s3_raw_path = s3://my-raw-bucket/events/
hdfs_processed_path = /data/lakehouse/processed/events

[formats]
input_format = json
output_format = parquet
compression = snappy

[spark]
shuffle_partitions = 200
dynamic_allocation = true

[incremental]
watermark_path = checkpoints/last_watermark.txt
checkpoint_dir = checkpoints/state
